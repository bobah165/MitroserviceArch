replicas:
  _default: 1
  dev: 3

selector : dev

name:
  app: demo-helm

service:
  nameApp: demo-helm-service
  portName: port-demo
  type: NodePort
  port: 80
  targetPort: 8000

image:
  repository: bobah165/arch
  tag: v22

ingress:
  enabled: false
  name: "demo-helm-ingress"
  className: nginx
  host: "arch.homework"
  pathType: Prefix
  path:
    person: /api/person
    health: /health

monitor:
  name: helm-demo-monitor
  path: /actuator/prometheus

db:
  url: jdbc:postgresql://my-db-postgresql:5432/postgres


app:
  db:
    password:
      _default: cG9zdGdyZXM=
    username:
      _default: cG9zdGdyZXM=
  security:
    admin:
      name: YWRtaW4=
      password: cGFzcw==
    user:
      name: dXNlcg==
      password: cGFzcw==

