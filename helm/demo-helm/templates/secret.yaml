---
apiVersion: v1
kind: Secret
metadata:
  name: secret-{{ .Values.name.app }}
type: Opaque
data:
  db_password: {{ .Values.app.db.password._default }}
  db_username: {{ .Values.app.db.username._default }}
  admin_username: {{ .Values.app.security.admin.name }}
  admin_password: {{ .Values.app.security.admin.password }}
  user_username: {{ .Values.app.security.user.name }}
  user_password: {{ .Values.app.security.user.password }}
