apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name.app }}
  labels:
    app: {{ .Values.name.app }}
spec:
  replicas: {{ .Values.replicas.dev | default .Values.replicas._default }}
  selector:
    matchLabels:
      app: {{ .Values.selector }}
  template:
    metadata:
      labels:
        app: {{ .Values.selector }}
    spec:
      containers:
        - name: {{ .Values.name.app }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: db_password
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: admin_username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: admin_password
            - name: USER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: user_username
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-{{ .Values.name.app }}
                  key: user_password

